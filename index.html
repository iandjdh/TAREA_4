<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarea 4 - Tabla de Precios y Planes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

  <div class="container">
    <div class="row g-4 align-items-center">

      <div class="col-12 col-md-4">
        <div class="card bg-light shadow-sm text-center p-4">
          <div class="card-body">
            <h4 class="card-title">Plan Estudiante</h4>
            <h1 class="display-4 fw-bold my-3">$9.99<small class="fs-6 text-muted">/mes</small></h1>
            <button class="btn btn-outline-primary w-100">Elegir Plan</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card bg-primary text-white shadow-lg text-center p-4 border-0">
          <div class="card-body">
            <span class="badge bg-warning text-dark mb-2">Más Popular</span>
            <h4 class="card-title">Plan Pro VIP</h4>
            <h1 class="display-4 fw-bold my-3">$24.99<small class="fs-6">/mes</small></h1>
            <button class="btn btn-warning w-100 fw-bold">Elegir Plan</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card bg-dark text-white shadow-sm text-center p-4">
          <div class="card-body">
            <h4 class="card-title">Plan Institucional</h4>
            <h1 class="display-4 fw-bold my-3">$79.99<small class="fs-6 text-muted">/mes</small></h1>
            <button class="btn btn-outline-light w-100">Elegir Plan</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
